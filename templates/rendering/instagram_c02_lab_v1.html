<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<style>

:root {

    --bg:
        #020812;

    --bg-deep:
        #01050B;

    --surface:
        #08182B;

    --blue:
        #2F91FF;

    --blue-bright:
        #55A9FF;

    --blue-dim:
        #1759A6;

    --white:
        #F7F8FA;

    --body:
        #D6DCE5;

    --muted:
        #77879B;
}


* {

    box-sizing:
        border-box;
}


html,
body {

    width:
        1080px;

    height:
        1350px;

    margin:
        0;

    padding:
        0;

    overflow:
        hidden;

    background:
        var(--bg);

    font-family:
        "DejaVu Sans",
        "Liberation Sans",
        sans-serif;

    -webkit-font-smoothing:
        antialiased;
}


#canvas {

    position:
        relative;

    width:
        1080px;

    height:
        1350px;

    overflow:
        hidden;

    color:
        var(--white);

    background:

        radial-gradient(
            circle at 70% 40%,
            rgba(
                31,
                111,
                220,
                0.19
            ),
            transparent 34%
        ),

        radial-gradient(
            circle at 24% 83%,
            rgba(
                19,
                79,
                155,
                0.12
            ),
            transparent 34%
        ),

        linear-gradient(
            155deg,
            #020914 0%,
            #020812 54%,
            #01050B 100%
        );
}


/* ==========================================================
   ATMOSPHERE
   ========================================================== */


#canvas::before {

    content:
        "";

    position:
        absolute;

    inset:
        0;

    pointer-events:
        none;

    opacity:
        0.12;

    background-image:

        linear-gradient(
            rgba(
                255,
                255,
                255,
                0.015
            ) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(
                255,
                255,
                255,
                0.011
            ) 1px,
            transparent 1px
        );

    background-size:
        64px 64px;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 28%,
            black 72%,
            transparent
        );
}


.ambient-glow {

    position:
        absolute;

    width:
        470px;

    height:
        470px;

    left:
        415px;

    top:
        300px;

    border-radius:
        50%;

    background:
        rgba(
            30,
            111,
            232,
            0.16
        );

    filter:
        blur(95px);

    pointer-events:
        none;
}


/* ==========================================================
   TOP PROGRESS
   ========================================================== */


.progress {

    position:
        absolute;

    z-index:
        10;

    top:
        56px;

    left:
        72px;

    right:
        72px;

    height:
        7px;

    display:
        grid;

    grid-template-columns:
        repeat(
            {{TOTAL}},
            1fr
        );

    gap:
        15px;
}


.progress-segment {

    height:
        7px;

    background:
        rgba(
            122,
            138,
            158,
            0.31
        );
}


.progress-segment.complete,
.progress-segment.current {

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--blue-bright)
        );

    box-shadow:
        0 0 12px
        rgba(
            47,
            145,
            255,
            0.20
        );
}


/* ==========================================================
   HEADER
   ========================================================== */


.header {

    position:
        absolute;

    z-index:
        10;

    top:
        105px;

    left:
        72px;

    right:
        72px;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;
}


.brand {

    color:
        var(--blue-bright);

    font-size:
        22px;

    font-weight:
        600;

    letter-spacing:
        6px;

    text-transform:
        uppercase;
}


.series {

    color:
        rgba(
            85,
            169,
            255,
            0.80
        );

    font-size:
        17px;

    font-weight:
        600;

    letter-spacing:
        3px;

    text-transform:
        uppercase;
}


/* ==========================================================
   SIGNAL GRAPHIC
   ========================================================== */


.signal-field {

    position:
        absolute;

    z-index:
        1;

    left:
        -35px;

    top:
        205px;

    width:
        1115px;

    height:
        675px;

    pointer-events:
        none;
}


.signal-field svg {

    width:
        100%;

    height:
        100%;

    overflow:
        visible;
}


.signal-ghost {

    fill:
        none;

    stroke:
        rgba(
            82,
            157,
            255,
            0.13
        );

    stroke-width:
        2;
}


.signal-ghost.soft {

    stroke:
        rgba(
            82,
            157,
            255,
            0.07
        );
}


.signal-main {

    fill:
        none;

    stroke:
        var(--blue);

    stroke-width:
        3.2;

    filter:
        drop-shadow(
            0 0 7px
            rgba(
                47,
                145,
                255,
                0.52
            )
        );
}


.signal-dashed {

    fill:
        none;

    stroke:
        rgba(
            47,
            145,
            255,
            0.66
        );

    stroke-width:
        2.5;

    stroke-dasharray:
        15 15;
}


.signal-dot {

    fill:
        var(--blue-bright);

    filter:
        drop-shadow(
            0 0 14px
            var(--blue)
        );
}


/* ==========================================================
   TEXT AREA
   ========================================================== */


#content {

    position:
        absolute;

    z-index:
        5;

    left:
        72px;

    right:
        72px;

    top:
        340px;

    bottom:
        128px;

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;

    min-width:
        0;

    min-height:
        0;
}


.kicker {

    flex:
        0 0 auto;

    margin-bottom:
        23px;

    color:
        var(--blue-bright);

    font-size:
        24px;

    line-height:
        1.1;

    font-weight:
        650;

    letter-spacing:
        7px;

    text-transform:
        uppercase;
}


#headline {

    flex:
        0 0 auto;

    max-width:
        930px;

    margin:
        0 0 30px 0;

    color:
        var(--white);

    font-family:
        "DejaVu Sans Condensed",
        "DejaVu Sans",
        "Liberation Sans",
        sans-serif;

    font-size:
        {{HEADLINE_SIZE}}px;

    line-height:
        0.94;

    font-weight:
        900;

    letter-spacing:
        -2.6px;

    text-transform:
        uppercase;

    overflow-wrap:
        anywhere;
}


#body {

    flex:
        0 0 auto;

    max-width:
        900px;

    color:
        var(--body);

    font-size:
        {{BODY_SIZE}}px;

    line-height:
        1.38;

    font-weight:
        400;

    letter-spacing:
        -0.35px;

    white-space:
        pre-wrap;

    overflow-wrap:
        anywhere;

    text-shadow:
        0 1px 12px
        rgba(
            0,
            0,
            0,
            0.85
        );
}


/* ==========================================================
   EMPHASIS / INTERPRETATION
   ========================================================== */


#emphasis-wrapper {

    flex:
        0 0 auto;

    position:
        relative;

    margin-top:
        38px;

    padding:
        20px
        0
        20px
        63px;

    min-height:
        62px;
}


#emphasis-wrapper.hidden {

    display:
        none;
}


#emphasis-wrapper::before {

    content:
        "";

    position:
        absolute;

    left:
        0;

    top:
        34px;

    width:
        42px;

    height:
        3px;

    background:
        var(--blue-bright);

    box-shadow:
        0 0 10px
        rgba(
            47,
            145,
            255,
            0.45
        );
}


#emphasis-wrapper::after {

    content:
        "";

    position:
        absolute;

    left:
        0;

    top:
        30px;

    width:
        11px;

    height:
        11px;

    border-radius:
        50%;

    background:
        var(--blue-bright);

    box-shadow:
        0 0 13px
        rgba(
            47,
            145,
            255,
            0.75
        );
}


#emphasis {

    max-width:
        820px;

    color:
        var(--white);

    font-size:
        {{EMPHASIS_SIZE}}px;

    line-height:
        1.28;

    font-weight:
        500;

    overflow-wrap:
        anywhere;
}


/* ==========================================================
   OPENING SLIDE
   ========================================================== */


.slide-opening
.signal-field {

    top:
        125px;

    opacity:
        0.92;

    transform:
        translateX(95px)
        scale(0.88);

    transform-origin:
        center;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            black 0%,
            black 45%,
            rgba(0, 0, 0, 0.65) 58%,
            transparent 76%
        );

    mask-image:
        linear-gradient(
            to bottom,
            black 0%,
            black 45%,
            rgba(0, 0, 0, 0.65) 58%,
            transparent 76%
        );
}


.slide-opening
#content {

    top:
        500px;

    justify-content:
        center;
}


.slide-opening
#headline {

    max-width:
        890px;
}


/* ==========================================================
   STANDARD EVIDENCE SLIDE
   ========================================================== */


.slide-evidence
.signal-field {

    top:
        80px;

    opacity:
        0.42;

    transform:
        translateX(340px)
        scale(0.70);

    transform-origin:
        center;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            black 0%,
            black 62%,
            transparent 92%
        );

    mask-image:
        linear-gradient(
            to bottom,
            black 0%,
            black 62%,
            transparent 92%
        );
}


.slide-evidence
#content {

    top:
        260px;

    bottom:
        150px;

    justify-content:
        center;
}


/* ==========================================================
   FINAL / NEXT MOVE
   ========================================================== */


.slide-final
.signal-field {

    top:
        55px;

    opacity:
        0.72;

    transform:
        translateX(185px)
        scale(0.80);

    transform-origin:
        center;

    -webkit-mask-image:
        linear-gradient(
            to bottom,
            black 0%,
            black 58%,
            transparent 88%
        );

    mask-image:
        linear-gradient(
            to bottom,
            black 0%,
            black 58%,
            transparent 88%
        );
}


.slide-final
#content {

    top:
        510px;

    bottom:
        125px;

    justify-content:
        center;
}


.slide-final
#emphasis-wrapper {

    margin-top:
        36px;

    padding:
        25px
        30px;

    border-radius:
        18px;

    min-height:
        90px;

    background:
        linear-gradient(
            105deg,
            #267EF0 0%,
            #3698FF 100%
        );

    box-shadow:
        0 14px 50px
        rgba(
            21,
            94,
            194,
            0.20
        );
}


.slide-final
#emphasis-wrapper::before,
.slide-final
#emphasis-wrapper::after {

    display:
        none;
}


.slide-final
#emphasis {

    color:
        white;

    font-weight:
        700;
}


/* ==========================================================
   FOOTER
   ========================================================== */


.footer {

    position:
        absolute;

    z-index:
        10;

    left:
        72px;

    right:
        72px;

    bottom:
        53px;

    height:
        43px;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;
}


.footer-mark {

    color:
        rgba(
            85,
            169,
            255,
            0.74
        );

    font-size:
        16px;

    font-weight:
        650;

    letter-spacing:
        4px;

    text-transform:
        uppercase;
}


.slide-number {

    display:
        flex;

    gap:
        7px;

    align-items:
        baseline;

    color:
        var(--blue);
}


.slide-current {

    font-size:
        31px;

    font-weight:
        700;
}


.slide-total {

    color:
        var(--muted);

    font-size:
        17px;

    font-weight:
        600;
}


/* ==========================================================
   SUBTLE EDGE FADE
   ========================================================== */


.edge-fade {

    position:
        absolute;

    z-index:
        3;

    left:
        0;

    right:
        0;

    bottom:
        0;

    height:
        260px;

    pointer-events:
        none;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(
                1,
                5,
                11,
                0.68
            )
        );
}

</style>

</head>


<body>


<div
    id="canvas"
    class="{{SLIDE_CLASS}}"
>


    <div class="ambient-glow"></div>


    <div class="progress">
        {{PROGRESS_SEGMENTS}}
    </div>


    <header class="header">

        <div class="brand">
            DAUNTRA // EVIDENCE
        </div>

        <div class="series">
            RESEARCH
        </div>

    </header>


    <div class="signal-field">

        <svg
            viewBox="0 0 1115 675"
            preserveAspectRatio="none"
            aria-hidden="true"
        >

            <defs>

                <linearGradient
                    id="signalGradient"
                    x1="0"
                    y1="1"
                    x2="1"
                    y2="0"
                >

                    <stop
                        offset="0%"
                        stop-color="#1762BE"
                    />

                    <stop
                        offset="100%"
                        stop-color="#55A9FF"
                    />

                </linearGradient>

            </defs>


            <path
                class="signal-ghost soft"
                d="
                    M -20 620
                    L 280 390
                    L 540 220
                    L 900 35
                "
            />


            <path
                class="signal-ghost"
                d="
                    M -30 650
                    L 300 400
                    L 560 235
                    L 925 40
                "
            />


            <path
                class="signal-dashed"
                d="
                    M 75 660
                    L 330 500
                    L 575 325
                    L 905 115
                "
            />


            <path
                class="signal-main"
                stroke="url(#signalGradient)"
                d="
                    M 40 630
                    L 335 415
                    L 600 245
                    L 950 52
                "
            />


            <circle
                class="signal-dot"
                cx="40"
                cy="630"
                r="7"
            />


            <circle
                class="signal-dot"
                cx="600"
                cy="245"
                r="6"
            />


            <circle
                class="signal-dot"
                cx="950"
                cy="52"
                r="9"
            />

        </svg>

    </div>


    <main id="content">

        <div class="kicker">
            {{KICKER}}
        </div>


        <div id="headline">
            {{HEADLINE}}
        </div>


        <div id="body">{{BODY}}</div>


        <div
            id="emphasis-wrapper"
            class="{{EMPHASIS_CLASS}}"
        >

            <div id="emphasis">
                {{EMPHASIS}}
            </div>

        </div>

    </main>


    <div class="edge-fade"></div>


    <footer class="footer">

        <div class="footer-mark">
            THE WORK, UNDERSTOOD.
        </div>


        <div class="slide-number">

            <span class="slide-current">
                {{SLIDE}}
            </span>

            <span class="slide-total">
                / {{TOTAL}}
            </span>

        </div>

    </footer>


</div>


</body>

</html>
